name: Build Turnip EXPERIMENTAL (Mesa main + A8xx patches)

# Экспериментальный Turnip под ваш rootfs (glibc aarch64, KGSL). Рецепт - из проекта Banners-Turnip (см. turnip-patches/README.md):
#   Mesa main  +  [A8xx: стек whitebelyash gen8 + серия Max winnative + скрипты]  +  два KGSL-патча для glibc.
# Рабочий Turnip (build-turnip.yml / встроенный 26.2.0) НЕ трогается: эта сборка ставится рядом отдельной версией
# (turnip-<версия>-<вариант>-<коммит>.tzst), её можно выбрать и откатиться.
#
# Патчи привязаны к конкретным версиям кода Mesa. Каждый патч применяется только целиком (иначе пропускается и
# виден в отчёте 'Патчи'). По умолчанию коммит 4da08cb (2026-09-30), на котором Banners-Turnip проверил A8xx-набор.
# На более новых коммитах часть патчей (например mesh shaders) может перестать ложиться - сборка это покажет и продолжится
# с тем, что применилось. Стабильные теги (mesa-26.2.x) не подойдут: стек gen8 рассчитан на 26.3-devel.

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: '40-значный коммит Mesa ИЛИ ветка (main). По умолчанию 4da08cb (2026-09-30): на нём Banners-Turnip проверил весь A8xx-набор без отказов'
        required: false
        default: '4da08cb8adfbdc103bc517b45040a19957b7404d'
      variant:
        description: 'standard = Mesa main без патчей; a8xx = Adreno 8xx (830/840...) + патчи'
        required: true
        type: choice
        default: 'a8xx'
        options:
          - a8xx
          - standard
      linux_patches:
        description: 'Два KGSL-патча для glibc (DRM-узел, calibrated timestamps)'
        required: true
        type: boolean
        default: true
      mesa_repo:
        description: 'Git-репозиторий Mesa'
        required: true
        default: 'https://gitlab.freedesktop.org/mesa/mesa.git'

env:
  # Нет chroot: пути запекаются с маркером, приложение подменяет его при распаковке (см. build-turnip.yml)
  PFX: /data/data/@@@@@@@@@@@@@@@@@@@@@@@@@/usr

jobs:
  build:
    name: turnip-experimental
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      MESA_REPO: ${{ inputs.mesa_repo }}
      MESA_REF: ${{ inputs.mesa_ref }}
      VARIANT: ${{ inputs.variant }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout (patches)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Resolve Mesa commit
        run: |
          REF="${MESA_REF:-main}"
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then SHA="$REF"
          else
            SHA=$(git ls-remote "$MESA_REPO" "refs/heads/$REF" "refs/tags/$REF" | head -n1 | cut -f1)
            [ -n "$SHA" ] || { echo "::error::'$REF' not found in $MESA_REPO"; exit 1; }
          fi
          echo "MESA_COMMIT=$SHA" >> "$GITHUB_ENV"
          echo "Mesa commit: $SHA"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config bison flex zstd zip patch patchelf \
            python3 python3-venv python3-pip glslang-tools \
            libdrm-dev libexpat1-dev zlib1g-dev libzstd-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxxf86vm-dev libxrandr-dev libxshmfence-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev

      - name: Install meson and python modules (venv)
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --upgrade pip
          "$HOME/venv/bin/pip" install meson ninja mako pyyaml packaging pycparser ply
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Fetch Mesa
        run: |
          git init -q mesa-src
          git -C mesa-src remote add origin "$MESA_REPO"
          ok=0
          for i in 1 2 3 4; do
            if git -C mesa-src fetch -q --depth=1 origin "$MESA_COMMIT"; then ok=1; break; fi
            echo "fetch attempt $i failed, retry in 30 s"; sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::cannot fetch $MESA_COMMIT"; exit 1; }
          git -C mesa-src checkout -q FETCH_HEAD
          echo "Mesa VERSION: $(cat mesa-src/VERSION)"

      - name: Apply patches
        working-directory: mesa-src
        env:
          LINUX_PATCHES: ${{ inputs.linux_patches }}
          REPORT: /tmp/patch-report.txt
        run: |
          bash "$GITHUB_WORKSPACE/repo/turnip-patches/apply_series.sh" . "$GITHUB_WORKSPACE/repo/turnip-patches" "$VARIANT"
          {
            echo "### Патчи (${VARIANT}, Mesa ${MESA_COMMIT:0:10})"
            echo '```'; cat /tmp/patch-report.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # the variant name in the file reflects what really got in: without the gen8 stack it is just Mesa main
          if [ "$VARIANT" = "a8xx" ] && ! grep -q "^APPLIED a8xx_gen8.patch" /tmp/patch-report.txt; then
            echo "::warning::a8xx_gen8.patch was SKIPPED - this build is Mesa main without the A8xx stack"
            echo "VARIANT_LABEL=main" >> "$GITHUB_ENV"
          else
            echo "VARIANT_LABEL=$VARIANT" >> "$GITHUB_ENV"
          fi
          if [ "$VARIANT" = "a8xx" ] && ! grep -q "^APPLIED" /tmp/patch-report.txt; then
            echo "::error::not a single A8xx patch applied to this Mesa commit; try the default commit"; exit 1
          fi
          git --no-pager diff --stat | tail -n 25

      - name: Configure (Vulkan freedreno, KGSL)
        working-directory: mesa-src
        run: |
          python3 - meson.options meson_options.txt > /tmp/opts.txt 2>/dev/null <<'PY' || true
          import re, sys, os
          for f in sys.argv[1:]:
              if os.path.exists(f):
                  print("\n".join(re.findall(r"option\(\s*['\"]([^'\"]+)['\"]", open(f).read())))
                  break
          PY
          ARGS=()
          add() {
            if grep -qx -- "$1" /tmp/opts.txt; then ARGS+=("-D$1=$2")
            else echo "::notice::option '$1' not in this Mesa, skipped"; fi
          }
          add platforms x11
          add vulkan-drivers freedreno
          # msm must be listed next to kgsl (Banners-Turnip's finding): with kgsl alone meson drops libdrm and wsi_common_drm.c,
          # and vkCreateSwapchainKHR ends up in a compiled-out branch. libdrm is bundled below (turnip-deps).
          add freedreno-kmds msm,kgsl
          add gallium-drivers ""
          add vulkan-layers ""
          add tools ""
          add opengl false
          add llvm disabled
          add glx disabled
          add egl disabled
          add gbm disabled
          add gles1 disabled
          add gles2 disabled
          add gallium-va disabled
          add lmsensors disabled
          add libunwind disabled
          add valgrind disabled
          add build-tests false
          # driconf defaults are compiled in: the rootfs has no /usr/share/drirc.d of its own
          add xmlconfig disabled
          echo "Options: ${ARGS[*]}"
          meson setup build --buildtype=release -Dstrip=true \
            -Dprefix="$PFX" -Dlibdir=lib "${ARGS[@]}" \
            || { tail -80 build/meson-logs/meson-log.txt; exit 1; }

      - name: Build
        working-directory: mesa-src
        run: ninja -C build -j"$(nproc)" src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Package
        run: |
          set -eo pipefail
          LIB=mesa-src/build/src/freedreno/vulkan/libvulkan_freedreno.so
          [ -f "$LIB" ] || { echo "::error::libvulkan_freedreno.so was not built"; exit 1; }

          rm -rf pkg && mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d
          cp -aL "$LIB" pkg/usr/lib/

          # ICD with the marker path (the app replaces it while extracting)
          cat > pkg/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json <<ICD
          {
            "ICD": {
              "api_version": "1.4.0",
              "library_arch": "64",
              "library_path": "$PFX/lib/libvulkan_freedreno.so"
            },
            "file_format_version": "1.0.1"
          }
          ICD
          cat pkg/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
          grep -q '@@@@@@@@@@@@@@@@@@@@@@@@@' pkg/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json \
            || { echo "::error::marker is missing in the ICD json"; exit 1; }

          # libraries the rootfs may lack: separate folder + RUNPATH, rootfs libraries always win
          DEPS=pkg/usr/lib/turnip-deps
          mkdir -p "$DEPS"
          bundle() {
            for n in $(readelf -d "$1" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
              case "$n" in
                libxcb*|libX11*|libXau*|libXdmcp*|libxshmfence*|libXxf86vm*|libXdamage*|libXfixes*|libXrandr*|libXrender*|libXext*|libdrm*|libzstd*|libexpat*|libwayland*|libffi*) ;;
                *) continue ;;
              esac
              [ -e "$DEPS/$n" ] && continue
              src=$(ldconfig -p | awk -v n="$n" '$1==n{print $NF; exit}')
              if [ -n "$src" ]; then
                cp -L "$src" "$DEPS/$n"; patchelf --set-rpath '$ORIGIN' "$DEPS/$n"; echo "bundled $n"; bundle "$DEPS/$n"
              else echo "::warning::$n is needed but not found on the runner"; fi
            done
          }
          bundle pkg/usr/lib/libvulkan_freedreno.so
          patchelf --set-rpath '$ORIGIN/turnip-deps' pkg/usr/lib/libvulkan_freedreno.so
          readelf -d pkg/usr/lib/libvulkan_freedreno.so | grep -E "NEEDED|RUNPATH|RPATH"

          # file name = version shown in the app: <mesa>-<variant>-<commit>  (unique per build, never collides with built-in 26.2.0)
          V=$(tr -d '\n' < mesa-src/VERSION); V="${V%%-*}"
          VER="${V}-${VARIANT_LABEL:-$VARIANT}-${MESA_COMMIT:0:7}"
          mkdir -p out
          tar -C pkg -I 'zstd -19' -cf "out/turnip-${VER}.tzst" .
          tar -I zstd -tf "out/turnip-${VER}.tzst"

          {
            echo "### turnip-${VER}.tzst"
            echo "Mesa commit: ${MESA_COMMIT}  variant: ${VARIANT} (file: ${VARIANT_LABEL:-$VARIANT})  linux_patches: ${{ inputs.linux_patches }}"
            echo "patches: $(grep -c '^APPLIED' /tmp/patch-report.txt) applied, $(grep -c '^SKIPPED' /tmp/patch-report.txt) skipped (list in the 'Патчи' block above)"
            echo "Установка: Настройки -> Графический драйвер -> Установить драйвер из файла, затем выбрать эту версию в Turnip."
            echo '```'
            echo "NEEDED:"; readelf -d "$LIB" | grep NEEDED
            echo "bundled in turnip-deps: $(ls pkg/usr/lib/turnip-deps | tr '\n' ' ')"
            echo "max GLIBC required: $(objdump -T "$LIB" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)"
            echo "kgsl inside: $(strings "$LIB" | grep -c 'kgsl-3d0')"
            echo "built from: $(strings -a pkg/usr/lib/libvulkan_freedreno.so | grep -m1 -E '^Mesa [0-9]+\.[0-9]+')"
            echo "size: $(stat -c %s pkg/usr/lib/libvulkan_freedreno.so) bytes  <- the same number as 'size' in driver-report.txt"
            echo '```'
          } | tee out/info.txt "$GITHUB_STEP_SUMMARY"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-experimental
          path: out/*
          if-no-files-found: error
