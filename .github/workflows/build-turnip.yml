name: Build Turnip (proot / glibc, KGSL)

# Собирает Mesa Turnip (Vulkan для Adreno) ПОД ВАШ формат: glibc aarch64 для rootfs приложения.
# Результат: turnip-<версия>.tzst, внутри usr/lib/libvulkan_freedreno.so и usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
# (как у turnip-26.2.0.tzst в assets). Нет proot/chroot: пути в ICD - с маркером /data/data/@@@... (его подменяет приложение). Ставится в приложении:
#   Настройки -> Графический драйвер -> "Установить драйвер из файла"  (или Turnip -> установить -> "Из файла").
# Версия в имени файла берётся из mesa_ref, по ней приложение показывает сборку в списке Turnip.
#
# Это НЕ формат adrenotools (bionic, meta.json) - тот грузится через Vortek, это отдельный путь.

on:
  workflow_dispatch:
    inputs:
      mesa_repo:
        description: 'Git-репозиторий Mesa (можно форк с патчами)'
        required: true
        default: 'https://gitlab.freedesktop.org/mesa/mesa.git'
      mesa_ref:
        description: 'Тег/ветка: mesa-26.3.0 (или mesa-26.3.0-rc1, main). Если такого тега нет - в логе будет список существующих'
        required: true
        default: 'mesa-26.3.0'
      version_name:
        description: 'Версия в имени файла (пусто = из файла VERSION самой Mesa), например 26.3.0'
        required: false
        default: ''
      runner:
        description: 'ARM runner. 24.04 (gcc 13) - нужен для Mesa 26.2: на 22.04 (gcc 11) tu_autotune.h не компилируется'
        required: true
        type: choice
        default: 'ubuntu-24.04-arm'
        options:
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm

env:
  # В приложении НЕТ chroot: гость видит настоящие пути. Поэтому, как и в build-zink/build-opengl, все пути внутри
  # сборки "запекаются" с маркером; при распаковке приложение (PackagePath) подменяет его на реальный путь rootfs.
  PFX: /data/data/@@@@@@@@@@@@@@@@@@@@@@@@@/usr

jobs:
  build:
    name: turnip-glibc
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      MESA_REPO: ${{ inputs.mesa_repo }}
      MESA_REF: ${{ inputs.mesa_ref }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check Mesa ref
        run: |
          echo "Newest tags in $MESA_REPO:"
          git ls-remote --tags --refs "$MESA_REPO" 'mesa-2[6-9].*' | sed 's|.*refs/tags/||' | sort -V | tail -n 15
          if ! git ls-remote --exit-code --heads --tags "$MESA_REPO" "$MESA_REF" >/dev/null; then
            echo "::error::'$MESA_REF' does not exist in $MESA_REPO. Pick one of the tags above (or 'main')."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config bison flex zstd zip patch patchelf \
            python3 python3-venv python3-pip glslang-tools \
            libdrm-dev libexpat1-dev zlib1g-dev libzstd-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxxf86vm-dev libxrandr-dev libxshmfence-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev

      - name: Install meson and python modules (venv)
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --upgrade pip
          "$HOME/venv/bin/pip" install meson ninja mako pyyaml packaging pycparser ply
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      # Ubuntu 22.04 ships glslang 11.8, this Mesa needs >= 12.2. glslang is used only while building,
      # so a newer one does not affect glibc compatibility of the resulting driver.
      - name: Build newer glslang (only on 22.04)
        if: contains(inputs.runner, '22.04')
        run: |
          sudo apt-get install -y --no-install-recommends cmake
          git clone --depth 1 --branch 14.3.0 https://github.com/KhronosGroup/glslang.git
          cd glslang
          python3 update_glslang_sources.py
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/glslang -DBUILD_TESTING=OFF
          ninja -C build -j"$(nproc)" install
          echo "/opt/glslang/bin" >> "$GITHUB_PATH"
          /opt/glslang/bin/glslangValidator --version | head -n1

      - name: Clone Mesa
        run: |
          git ls-remote --exit-code --heads --tags "$MESA_REPO" "$MESA_REF" \
            || { echo "::error::Ref '$MESA_REF' not found in $MESA_REPO"; exit 1; }
          git clone --depth 1 --branch "$MESA_REF" "$MESA_REPO" mesa-src

      - name: Configure (Vulkan freedreno only, KGSL backend)
        working-directory: mesa-src
        run: |
          # take only the options this Mesa version really has (names changed between releases)
          python3 - meson.options meson_options.txt > /tmp/opts.txt 2>/dev/null <<'PY' || true
          import re, sys, os
          for f in sys.argv[1:]:
              if os.path.exists(f):
                  print("\n".join(re.findall(r"option\(\s*['\"]([^'\"]+)['\"]", open(f).read())))
                  break
          PY
          ARGS=()
          add() {
            if grep -qx -- "$1" /tmp/opts.txt; then ARGS+=("-D$1=$2")
            else echo "::notice::option '$1' not in this Mesa, skipped"; fi
          }
          add platforms x11
          add vulkan-drivers freedreno
          add freedreno-kmds kgsl
          add gallium-drivers ""
          add vulkan-layers ""
          add llvm disabled
          add glx disabled
          add egl disabled
          add gbm disabled
          add gles1 disabled
          add gles2 disabled
          add opengl false
          add gallium-va disabled
          add lmsensors disabled
          add libunwind disabled
          add valgrind disabled
          add build-tests false
          echo "Options: ${ARGS[*]}"
          meson setup build --buildtype=release -Dstrip=true \
            -Dprefix="$PFX" -Dlibdir=lib "${ARGS[@]}" \
            || { tail -80 build/meson-logs/meson-log.txt; exit 1; }

      - name: Build
        working-directory: mesa-src
        run: ninja -C build -j"$(nproc)"

      - name: Stage and package
        run: |
          rm -rf stage && DESTDIR="$PWD/stage" ninja -C mesa-src/build install
          ROOT="stage${PFX%/usr}"
          echo "===== installed files ====="
          find "$ROOT" \( -type f -o -type l \) | sort

          LIB="$ROOT/usr/lib/libvulkan_freedreno.so"
          ICD=$(ls "$ROOT"/usr/share/vulkan/icd.d/*freedreno*.json | head -n1)
          [ -f "$LIB" ] || { echo "::error::libvulkan_freedreno.so was not built"; exit 1; }
          [ -n "$ICD" ] || { echo "::error::ICD json was not installed"; exit 1; }
          echo "--- ICD as installed by Mesa ---"; cat "$ICD"

          # keep only what the app needs, same as turnip-26.2.0.tzst
          rm -rf pkg && mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d
          cp -aL "$LIB" pkg/usr/lib/

          # The rootfs may lack X/xcb libraries that the driver is linked against (that was the reason for
          # "libxcb-xfixes.so.0: cannot open shared object file" -> VK_ERROR_INCOMPATIBLE_DRIVER).
          # They go to a SEPARATE folder usr/lib/turnip-deps and are found through RUNPATH, so libraries that already
          # exist in the rootfs always win (LD_LIBRARY_PATH is searched before RUNPATH) and nothing gets overwritten.
          DEPS=pkg/usr/lib/turnip-deps
          mkdir -p "$DEPS"
          bundle() {
            for n in $(readelf -d "$1" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
              case "$n" in
                libxcb*|libX11*|libXau*|libXdmcp*|libxshmfence*|libXxf86vm*|libXdamage*|libXfixes*|libXrandr*|libXrender*|libXext*|libdrm*|libzstd*|libexpat*) ;;
                *) continue ;;
              esac
              [ -e "$DEPS/$n" ] && continue
              src=$(ldconfig -p | awk -v n="$n" '$1==n{print $NF; exit}')
              if [ -n "$src" ]; then
                cp -L "$src" "$DEPS/$n"
                patchelf --set-rpath '$ORIGIN' "$DEPS/$n"
                echo "bundled $n"
                bundle "$DEPS/$n"
              else
                echo "::warning::$n is needed but not found on the runner"
              fi
            done
          }
          bundle pkg/usr/lib/libvulkan_freedreno.so
          patchelf --set-rpath '$ORIGIN/turnip-deps' pkg/usr/lib/libvulkan_freedreno.so
          readelf -d pkg/usr/lib/libvulkan_freedreno.so | grep -E "NEEDED|RUNPATH|RPATH"
          # the ICD must point to the marker path (the app replaces it while extracting); written explicitly so it never depends on Mesa
          python3 - "$ICD" pkg/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json "$PFX/lib/libvulkan_freedreno.so" <<'PY'
          import json, sys
          src, dst, lib = sys.argv[1:4]
          d = json.load(open(src))
          d["ICD"]["library_path"] = lib
          json.dump(d, open(dst, "w"), indent=2)
          PY
          echo "--- ICD in the package ---"; cat pkg/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
          grep -q '@@@@@@@@@@@@@@@@@@@@@@@@@' pkg/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json \
            || { echo "::error::marker is missing in the ICD json"; exit 1; }

          VER="${{ inputs.version_name }}"
          if [ -z "$VER" ]; then
            V=$(tr -d '\n' < mesa-src/VERSION); V="${V%-devel}"
            VER="$V"
            case "$MESA_REF" in main|master) VER="$V-dev" ;; esac
          fi
          echo "Version: $VER (ref $MESA_REF)"
          mkdir -p out
          tar -C pkg -I 'zstd -19' -cf "out/turnip-${VER}.tzst" .
          tar -I zstd -tf "out/turnip-${VER}.tzst"

          {
            echo "### turnip-${VER}.tzst"
            echo "Установка: Настройки -> Графический драйвер -> Установить драйвер из файла"
            echo '```'
            echo "NEEDED:"; readelf -d "$LIB" | grep NEEDED
            echo "bundled in turnip-deps: $(ls pkg/usr/lib/turnip-deps | tr '\n' ' ')"
            echo "max GLIBC required: $(objdump -T "$LIB" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)"
            echo "kgsl inside: $(strings "$LIB" | grep -c 'kgsl-3d0')"
            echo "built from: $(strings -a pkg/usr/lib/libvulkan_freedreno.so | grep -m1 -E '^Mesa [0-9]+\.[0-9]+')"
            echo "size: $(stat -c %s pkg/usr/lib/libvulkan_freedreno.so) bytes  <- same number as 'size' in driver-report.txt"
            echo "marker paths inside the .so: $(strings "$LIB" | grep -c '@@@@@@@@@@@@@@@@@@@@@@@@@')"
            echo '```'
          } | tee out/info.txt "$GITHUB_STEP_SUMMARY"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-glibc
          path: out/*
          if-no-files-found: error
