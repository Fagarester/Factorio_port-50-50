name: Build APK

# Собирает APK Factory на GitHub.
# Запуск: вкладка Actions -> Build APK -> Run workflow. Также запускается при push в main (кроме правок документов).
#
# Среду выполнения (runtime.tar.xz, ~22 МБ) workflow не собирает: это долго и нужен Docker.
# Он берёт готовый файл из релиза (поле runtime_release) и кладёт в runtime/out-factory/assets/.
#
# Подпись (необязательно). Секреты репозитория (Settings -> Secrets and variables -> Actions):
#   FACTORY_KEYSTORE_BASE64  - keystore в base64
#   FACTORY_STORE_PASSWORD, FACTORY_KEY_ALIAS, FACTORY_KEY_PASSWORD
# Без них APK подписывается случайным debug-ключом раннера. Такой APK не ставится поверх APK,
# собранного на телефоне: сначала придётся удалить старый, а с ним и данные приложения.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        type: choice
        default: debug
        options: [debug, release, both]
      runtime_release:
        description: 'Тег релиза, из которого взять runtime.tar.xz'
        default: 'v1.0-hybrid-54'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      RUNTIME_RELEASE: ${{ inputs.runtime_release || 'v1.0-hybrid-54' }}
      NDK_VERSION: '29.0.14206865'
      # Старые CMakeLists в подмодулях Termux:X11 просят cmake_minimum_required < 3.5
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Patch Termux:X11
        run: sh tools/setup.sh

      - name: Runtime from release ${{ env.RUNTIME_RELEASE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RUNTIME_RELEASE" --pattern runtime.tar.xz --dir runtime/out-factory/assets --clobber
          ls -l runtime/out-factory/assets/
          sha256sum runtime/out-factory/assets/runtime.tar.xz

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - uses: gradle/actions/setup-gradle@v6

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FACTORY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FACTORY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FACTORY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FACTORY_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Секретов подписи нет: APK будет подписан debug-ключом раннера."
            exit 0
          fi
          dir="$RUNNER_TEMP/factory-keys"
          mkdir -p "$dir"
          echo "$KEYSTORE_BASE64" | base64 -d > "$dir/factory.keystore"
          {
            echo "storeFile=$dir/factory.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/keystore.properties"
          echo "FACTORY_SIGNING=$dir/keystore.properties" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          case "$BUILD_TYPE" in
            debug)   tasks=":app:assembleDebug" ;;
            release) tasks=":app:assembleRelease" ;;
            *)       tasks=":app:assembleDebug :app:assembleRelease" ;;
          esac
          ./gradlew $tasks --stacktrace

      - name: Check APK
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk"
            "$aapt2" dump badging "$apk" | grep -E "^package|native-code"
            "$apksigner" verify --print-certs "$apk" 2>/dev/null | grep -E "DN|SHA-256" || echo "APK не подписан"
            sha256sum "$apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Factory-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
