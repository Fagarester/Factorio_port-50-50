apply plugin: 'com.android.application'

android {
    namespace 'com.factory'
    compileSdk 36
    ndkVersion '29.0.14206865'   // what :lorie pins, so its native code builds once

    defaultConfig {
        applicationId 'com.factory'
        minSdk 29
        // 29 + requestLegacyExternalStorage: the game folder is read from Download/factorio like before
        targetSdk 29
        versionCode 101
        versionName '1.0-hybrid-94'
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild.cmake.path 'src/main/cpp/CMakeLists.txt'

    // Extracted native libraries are the only files an app may exec on Android 10+; the glibc loader is one.
    packaging.jniLibs.useLegacyPackaging true

    // Built by runtime/build.sh assemble.
    sourceSets.main {
        // runtime/out/apk with the package path patched for com.factory (tools/repack-runtime.py)
        assets.srcDirs += '../runtime/out-factory/assets'
        jniLibs.srcDirs += '../runtime/out-factory/jniLibs'
    }

    // The release key signs debug builds too, so either installs over the other and the copied game stays.
    def signing = file(System.getenv('FACTORY_SIGNING') ?: '../../factory-keys/keystore.properties')
    if (signing.exists()) {
        def key = new Properties()
        signing.withInputStream { key.load(it) }
        signingConfigs {
            factory {
                storeFile file(key.storeFile)
                storePassword key.storePassword
                keyAlias key.keyAlias
                keyPassword key.keyPassword
            }
        }
        buildTypes {
            debug.signingConfig signingConfigs.factory
            release.signingConfig signingConfigs.factory
        }
    }

    // targetSdk 29 is deliberate (see defaultConfig) and the app isn't on Google Play: this check alone stops release builds.
    lint.disable 'ExpiredTargetSdkVersion'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':lorie')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.28.0'
}
