apply plugin: 'com.android.application'

// Optional local build on an ARM64 phone. This directory must contain the full
// arm64-v8a library set; normal CI still builds native libraries from source.
def prebuiltNativeDir = project.findProperty('factorioPrebuiltNativeDir')

android {
    compileSdk 34
    if (project.hasProperty('factorioBuildTools')) buildToolsVersion project.property('factorioBuildTools')

    defaultConfig {
        applicationId 'com.factorio'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 35
        versionName "11.0-r34-bundled-opengl"
    }

    signingConfigs {
        debug {
            storeFile file('debug-fixed.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    if (prebuiltNativeDir) {
        sourceSets.main.jniLibs.srcDirs = [prebuiltNativeDir]
    } else {
        ndkVersion '24.0.8215888'
        externalNativeBuild {
            cmake {
                version '3.22.1'
                path 'src/main/cpp/CMakeLists.txt'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
